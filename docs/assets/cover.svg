    <text x="64" y="190" font-size="104" font-weight="750" letter-spacing="-5" fill="#F4F6EE">Qazaq</text>
    <text x="64" y="292" font-size="104" font-weight="750" letter-spacing="-5" fill="#C3F27B">Loc QA<tspan fill="#F4F6EE">.</tspan></text>
    <text x="68" y="350" font-size="27" font-weight="500" fill="#E8EEE7">Игровой казахский. Под контролем.</text>
    <text x="68" y="385" font-size="16" fill="#A2B7AA">Смысл, термины и структура — в одной очереди решений.</text>
    <path d="M68 429H666" stroke="#506458" stroke-opacity=".5"/>
    <text x="68" y="463" font-size="15" fill="#D4DFD4">Найти <tspan fill="#819B85"> / </tspan> Объяснить <tspan fill="#819B85"> / </tspan> Предложить <tspan fill="#819B85"> / </tspan> Проверить</text>
    <rect x="760" y="113" width="456" height="300" rx="15" fill="#1A2A23" stroke="#405346"/>
    <path d="M760 166H1216" stroke="#405346"/>
    <circle cx="786" cy="140" r="4" fill="#C3F27B"/>
    <text x="801" y="145" font-size="13" fill="#D1DFD2">demoGreeting</text>
    <text x="1120" y="145" font-size="12" fill="#8CA793">ru → kk</text>
    <text x="786" y="196" font-size="10" letter-spacing="1.8" fill="#8CA793">ОРИГИНАЛ</text>
    <text x="786" y="228" font-size="23" fill="#EDF2E8">Привет, <tspan fill="#C3F27B">{pilot}</tspan>!</text>
    <text x="786" y="271" font-size="10" letter-spacing="1.8" fill="#8CA793">ПЕРЕВОД</text>
    <text x="786" y="303" font-size="23" fill="#EDF2E8">Сәлем, <tspan fill="#F6B783">pilot</tspan>!</text>
