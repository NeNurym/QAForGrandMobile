<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Qazaq Loc QA — игровой казахский под контролем</title>
  <desc id="desc">Контроль локализации: найти, объяснить, предложить, проверить. Справа вымышленный пример потерянного плейсхолдера.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#B8D5C3" stroke-opacity=".045"/></pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#101B18"/><stop offset="1" stop-color="#172721"/></linearGradient>
    <linearGradient id="line" x1="707" y1="134" x2="1280" y2="482" gradientUnits="userSpaceOnUse"><stop stop-color="#C3F27B" stop-opacity=".02"/><stop offset="1" stop-color="#C3F27B" stop-opacity=".25"/></linearGradient>
  </defs>
  <rect width="1280" height="520" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="20" fill="url(#grid)"/>
  <path d="M690 520C690 386 827 439 827 326S1038 265 1038 134 1178 20 1280 20M740 520C740 410 877 463 877 350S1088 289 1088 158 1228 44 1280 44M790 520C790 434 927 487 927 374S1138 313 1138 182 1248 68 1280 68" stroke="url(#line)"/>
